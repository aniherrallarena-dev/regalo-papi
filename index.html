<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para el mejor papá ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root {
  --fondo: #0d0910;
  --rosa: #ff8eaf;
  --rojo: #e83d70;
  --blanco: #fff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--fondo);
  color: var(--blanco);
  font-family: "Press Start 2P", monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
}

/* FONDO DE ESTRELLAS */
#estrellas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  z-index: 0;
  pointer-events: none;
}

.pantalla {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 28px;
}

.oculto { display: none !important; }

h1 {
  font-size: clamp(13px, 4vw, 19px);
  line-height: 2;
  font-weight: normal;
}

button {
  font-family: inherit;
  color: white;
  background: var(--rojo);
  border: none;
  padding: 17px 22px;
  font-size: 11px;
  cursor: pointer;
  box-shadow: 0 5px #8c2048;
}

button:active {
  transform: translateY(4px);
  box-shadow: 0 1px #8c2048;
}

button:focus-visible { outline: 3px solid #ffe29b; outline-offset: 3px; }

canvas {
  image-rendering: pixelated;
  max-width: 100%;
}

/* SOBRE */
.sobre {
  position: relative;
  width: min(78vw, 280px);
  height: 190px;
  margin-top: 70px;
  padding: 0;
  background: none;
  box-shadow: none;
}
.sobre:active { transform: none; box-shadow: none; }
.sobre > div { position: absolute; }

.s-fondo { inset: 0; background: #a92f5c; z-index: 1; }

.s-carta {
  left: 8%; right: 8%; top: 8px; bottom: 14px;
  background:
    repeating-linear-gradient(#fff3ea 0 12px, #f2c9d8 12px 14px);
  border: 3px solid #fff3ea;
  z-index: 2;
  transition: transform 1s ease .6s;
}

.s-frente {
  inset: 0;
  background: #e0507f;
  clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  z-index: 3;
}

.s-solapa {
  left: 0; right: 0; top: 0; height: 62%;
  background: #c8416f;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  z-index: 4;
  transition: transform .7s ease, z-index 0s .35s;
}

.sello {
  left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  font-size: 22px;
  z-index: 5;
  transition: opacity .3s;
}

.abierto .s-solapa { transform: rotateX(180deg); z-index: 1; }
.abierto .s-carta { transform: translateY(-75px); }
.abierto .sello { opacity: 0; }

.aviso {
  font-size: 9px;
  color: #ffd9e6;
  animation: parpadeo 1.4s steps(2) infinite;
}

@keyframes parpadeo { 50% { opacity: .25; } }

/* CARTA ABIERTA */
.papel {
  width: 100%;
  background: #fff3ea;
  color: #4a1d33;
  border: 4px solid #e83d70;
  box-shadow: 0 6px #8c2048;
  padding: 26px 20px;
  text-align: left;
  font-size: clamp(9px, 2.8vw, 11px);
  line-height: 2.4;
  white-space: pre-line;
  min-height: 220px;
  animation: florecer 1s ease both;
}

#mensaje {
  font-size: clamp(14px, 5vw, 22px);
  line-height: 1.8;
  min-height: 35px;
  opacity: 0;
  transition: opacity 1s;
}

.visible { opacity: 1 !important; }

#flores {
  width: min(95vw, 430px);
  aspect-ratio: 1;
  image-rendering: pixelated;
  animation: florecer 1.5s ease both;
}

#poema {
  font-size: clamp(8px, 2.5vw, 11px);
  color: #ffd9e6;
  line-height: 2.6;
  white-space: pre-line;
  opacity: 0;
  transition: opacity 2s;
  max-width: 450px;
}

.secundario {
  background: transparent;
  color: #ffadc7;
  border: 2px solid #774057;
  box-shadow: none;
  font-size: 9px;
}

/* BOTÓN DE MÚSICA */
#btnMusica {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 5;
  padding: 10px 12px;
  font-size: 14px;
  background: rgba(13, 9, 16, .7);
}

@keyframes florecer {
  from { opacity: 0; transform: scale(.8); filter: brightness(.3); }
  to { opacity: 1; transform: scale(1); filter: brightness(1); }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    transition-delay: 0s !important;
  }
}
</style>
</head>

<script>

/* PERSONALIZACIÓN */

const CARTA = `Papá:

Hice algo especial para ti.

Ábrelo con calma,
porque está hecho con todo mi cariño. Atentamente: Anhely.`;

const MENSAJE = "tqm papá";

const POEMA = `Hay personas que son como el sol,
incluso en los días nublados,
siempre encuentran la manera de darnos luz.

Gracias por cada esfuerzo silencioso,
por cada sacrificio y cada enseñanza,
por cuidar de nosotros incluso
cuando el camino no ha sido fácil.

Quizá no siempre encuentre las palabras
para expresar cuánto te admiro,
pero quiero que sepas algo:

Si la vida me regalara mil caminos,
en todos quisiera tenerte como mi papá.

Te quiero muchísimo. ❤️`;


/* ELEMENTOS */

const inicio = document.getElementById("inicio");
const sobre = document.getElementById("sobre");
const carta = document.getElementById("carta");
const textoCarta = document.getElementById("textoCarta");
const btnContinuar = document.getElementById("btnContinuar");
const escena = document.getElementById("escena");
const regalo = document.getElementById("regalo");
const canvas = document.getElementById("corazon");
const ctx = canvas.getContext("2d");
const mensaje = document.getElementById("mensaje");
const btnRamo = document.getElementById("btnRamo");
const poema = document.getElementById("poema");
const musica = document.getElementById("musica");
const btnMusica = document.getElementById("btnMusica");

const reducido = matchMedia(
  "(prefers-reduced-motion: reduce)"
).matches;


/* ESTRELLAS */

const cv = document.getElementById("estrellas");
const c2 = cv.getContext("2d");
let estrellas = [];

function crearEstrellas() {
  cv.width = innerWidth;
  cv.height = innerHeight;

  const n = Math.floor(innerWidth * innerHeight / 6000);

  estrellas = Array.from({length: n}, () => ({
    x: Math.random() * cv.width,
    y: Math.random() * cv.height,
    t: Math.random() < .15 ? 3 : 2,
    f: Math.random() * 6.28,
    v: .5 + Math.random() * 1.5,
    c: Math.random() < .2 ? "#ffd9e6" : "#fff"
  }));
}

function pintarEstrellas(ms) {
  c2.clearRect(0, 0, cv.width, cv.height);

  estrellas.forEach(e => {
    c2.globalAlpha = reducido
      ? .8
      : .35 + .65 * Math.abs(Math.sin(ms / 1000 * e.v + e.f));
    c2.fillStyle = e.c;
    c2.fillRect(Math.round(e.x), Math.round(e.y), e.t, e.t);
  });

  c2.globalAlpha = 1;

  if(!reducido) requestAnimationFrame(pintarEstrellas);
}

crearEstrellas();
pintarEstrellas(0);

if(!reducido) requestAnimationFrame(pintarEstrellas);


/* MÚSICA */

function alternarMusica() {
  if(musica.paused) {
    musica.play().catch(()=>{});
    btnMusica.textContent = "🔊";
  } else {
    musica.pause();
    btnMusica.textContent = "🔇";
  }
}

function iniciarMusica() {
  btnMusica.classList.remove("oculto");
  musica.volume = .6;
  musica.play().then(()=>{
    btnMusica.textContent = "🔊";
  }).catch(()=>{
    btnMusica.textContent = "🔇";
  });
}


/* CORAZÓN */

const COLS = 33;
const ROWS = 30;

let pixeles = [];
let lado = 0;
let raf;
let reloj;

function prepararCorazon() {

  pixeles = [];

  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS; c++) {

      const x = c/(COLS-1)*2.7-1.35;
      const y = 1.4-r/(ROWS-1)*2.65;

      const dentro =
        Math.pow(x*x+y*y-1,3) -
        x*x*Math.pow(y,3) <= 0;

      if(!dentro) continue;

      const t = r/(ROWS-1);

      const colores = [
        Math.round(255+(224-255)*t),
        Math.round(107+(25-107)*t),
        Math.round(154+(79-154)*t)
      ];

      const brillo =
        x<-.25 && y>.45 && Math.random()<.5 ? 30 : 0;

      colores[0] = Math.min(255,colores[0]+brillo);

      pixeles.push({
        c,r,
        color:`rgb(${colores.join(",")})`,
        orden:(1-t)+Math.random()*.45
      });
    }
  }

  const max = Math.max(...pixeles.map(p=>p.orden));

  pixeles.forEach(p=>{
    p.inicio=p.orden/max*.85;
  });
}

function ajustarCanvas() {

  const ancho = Math.min(
    window.innerWidth*.85,
    420
  );

  lado = Math.max(1,Math.floor(ancho/COLS));

  const d = window.devicePixelRatio || 1;

  canvas.width = COLS*lado*d;
  canvas.height = ROWS*lado*d;

  canvas.style.width = COLS*lado+"px";
  canvas.style.height = ROWS*lado+"px";

  ctx.setTransform(d,0,0,d,0,0);
}

function dibujarCorazon(progreso,latido) {

  const w = COLS*lado;
  const h = ROWS*lado;

  ctx.clearRect(0,0,w,h);

  ctx.save();

  ctx.translate(w/2,h/2);
  ctx.scale(latido,latido);
  ctx.translate(-w/2,-h/2);

  pixeles.forEach(p=>{

    const avance=(progreso-p.inicio)/.15;

    if(avance<=0) return;

    const escala=avance>=1
      ? 1
      : 1-Math.pow(1-avance,3);

    const tam=lado*escala;
    const off=(lado-tam)/2;

    ctx.fillStyle=p.color;

    ctx.fillRect(
      p.c*lado+off,
      p.r*lado+off,
      Math.max(0,tam-1),
      Math.max(0,tam-1)
    );

  });

  ctx.restore();
}


/* ANIMACIÓN */

function escribir(elemento,texto,velocidad,callback) {

  clearInterval(reloj);

  elemento.textContent="";
  elemento.classList.add("visible");

  let i=0;

  reloj=setInterval(()=>{

    elemento.textContent=texto.slice(0,++i);

    if(i>=texto.length) {
      clearInterval(reloj);
      if(callback) callback();
    }

  },reducido?0:velocidad);
}

function reproducir() {

  cancelAnimationFrame(raf);
  clearInterval(reloj);

  mensaje.classList.remove("visible");
  btnRamo.classList.add("oculto");

  prepararCorazon();
  ajustarCanvas();

  const inicioTiempo=performance.now();
  const duracion=reducido?1:5000;

  function animar(ahora) {

    const t=ahora-inicioTiempo;
    const progreso=Math.min(t/duracion,1.2);

    const despues=Math.max(0,t-duracion);

    const latido=reducido?1:
      1+.035*Math.max(0,Math.sin(despues/260));

    dibujarCorazon(progreso,latido);

    if(progreso>=1) {

      if(!mensaje.classList.contains("visible")) {

        escribir(mensaje,MENSAJE,160,()=>{
          btnRamo.classList.remove("oculto");
        });

      }

    }

    raf=requestAnimationFrame(animar);
  }

  raf=requestAnimationFrame(animar);
}


/* NAVEGACIÓN */

function abrirSobre() {

  if(sobre.classList.contains("abierto")) return;

  iniciarMusica();
  sobre.classList.add("abierto");

  setTimeout(()=>{

    inicio.classList.add("oculto");
    carta.classList.remove("oculto");

    escribir(textoCarta,CARTA,55,()=>{
      btnContinuar.classList.remove("oculto");
    });

  },reducido?100:2100);
}

function iniciar() {

  clearInterval(reloj);

  carta.classList.add("oculto");
  escena.classList.remove("oculto");

  reproducir();
}

function mostrarRamo() {

  cancelAnimationFrame(raf);
  clearInterval(reloj);

  escena.classList.add("oculto");
  regalo.classList.remove("oculto");

  poema.classList.remove("visible");

  escribir(poema,POEMA,65);
}

function reiniciar() {

  clearInterval(reloj);
  cancelAnimationFrame(raf);

  regalo.classList.add("oculto");
  escena.classList.remove("oculto");

  reproducir();
}

window.addEventListener("resize",()=>{

  crearEstrellas();
  if(reducido) pintarEstrellas(0);

  if(!escena.classList.contains("oculto")) {
    ajustarCanvas();
  }
